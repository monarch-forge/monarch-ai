<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121213" />
<title>Monarch</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121213; color: #f4f4f6;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 i { width: 8px; height: 8px; border-radius: 50%; background: #d71921; display: inline-block; }
  p { color: #9e9ea4; margin: 0 0 20px; font-size: 13.5px; }
  label { display: block; font-size: 12.5px; color: #9e9ea4; margin: 14px 0 6px; }
  input { width: 100%; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #323236; background: #1c1c1e;
          color: #f4f4f6; font: inherit; outline: none; }
  input:focus { border-color: #5e5e64; }
  button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 8px; background: #d71921; color: #fff;
           font: 600 15px system-ui, sans-serif; }
  button:active { background: #b8141b; }
  .err { color: #f0686d; font-size: 13px; min-height: 20px; margin-top: 10px; }
  small { display: block; color: #5e5e64; font-size: 12px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1><i></i>Monarch</h1>
  <p>Connect to Monarch on your laptop. Turn on Phone access there (Config → Phone access) and keep Tailscale running on both devices.</p>
  <form id="f" autocomplete="off">
    <label for="link">Pairing link or laptop address</label>
    <input id="link" inputmode="url" placeholder="http://100.x.y.z:7720/pair?code=…" required />
    <label for="code">Pairing code (if you entered an address)</label>
    <input id="code" inputmode="text" placeholder="Shown next to the QR on the laptop" />
    <button type="submit">Connect</button>
    <div class="err" id="err"></div>
  </form>
  <small>Already paired? Just enter the address — the phone stays signed in until you revoke it on the laptop.</small>
</main>
<script>
  const KEY = 'monarch.host';
  const $ = (id) => document.getElementById(id);
  // A saved host opens straight away; Android's back button returns here to change it.
  const saved = localStorage.getItem(KEY);
  if (saved && !sessionStorage.getItem('monarch.shown')) {
    sessionStorage.setItem('monarch.shown', '1');
    location.replace(saved + '/');
  }
  if (saved) $('link').value = saved;

  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    $('err').textContent = '';
    let raw = $('link').value.trim();
    if (!/^https?:\/\//i.test(raw)) raw = 'http://' + raw;
    let url;
    try { url = new URL(raw); } catch { $('err').textContent = 'That does not look like an address.'; return; }
    const code = (url.searchParams.get('code') || $('code').value).trim();
    const host = url.origin;
    localStorage.setItem(KEY, host);
    sessionStorage.setItem('monarch.shown', '1');
    location.href = code ? host + '/pair?code=' + encodeURIComponent(code) : host + '/';
  });
</script>
</body>
</html>
